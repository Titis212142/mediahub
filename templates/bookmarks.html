<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Favoris – MediaHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #1e1e2f; color: #fff; padding: 30px; max-width: 800px; margin: 0 auto; }
    h1 { margin-bottom: 20px; }
    .post-card { background: #2f2f44; border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
    .post-header { padding: 12px 16px; font-weight: bold; border-bottom: 1px solid #3a3a57; }
    .post-header a { color: #c9c9ff; text-decoration: none; }
    .post-image img { width: 100%; max-height: 400px; object-fit: cover; }
    .post-content { padding: 16px; font-size: 15px; line-height: 1.6; }
    .post-time { padding: 0 16px 12px; font-size: 13px; color: #888; }
    .empty { color: #888; text-align: center; margin-top: 40px; }
    a.back { color: #c9c9ff; text-decoration: none; display: inline-block; margin-bottom: 20px; }
  </style>
</head>
<body>
  <a href="{{ url_for('index') }}" class="back">← Retour</a>
  <h1>Mes favoris</h1>

  {% for post in posts %}
  <div class="post-card">
    <div class="post-header">
      <a href="{{ url_for('user_profile', username=post.author.username) }}">{{ post.author.username }}</a>
    </div>
    {% if post.image_filename %}
    <div class="post-image">
      <img src="{{ url_for('static', filename='uploads/' + post.image_filename) }}" />
    </div>
    {% endif %}
    <div class="post-content">{{ post.content | render_mentions }}</div>
    <div class="post-time">{{ post.created_at | time_ago }}</div>
  </div>
  {% else %}
  <p class="empty">Aucun post sauvegarde.</p>
  {% endfor %}

  <script src="{{ url_for('static', filename='fingerprint.js') }}"></script>
</body>
</html>
