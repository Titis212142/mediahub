<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Conversation avec {{ partner.username }} – MediaHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #1e1e2f; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    .header { background: #2f2f44; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
    .header a { color: #c9c9ff; text-decoration: none; font-size: 20px; }
    .header .name { font-weight: 600; font-size: 18px; }
    .messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 70%; padding: 10px 16px; border-radius: 16px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
    .msg.sent { background: #6c63ff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg.received { background: #2f2f44; align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg .time { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 4px; }
    .input-bar { background: #2f2f44; padding: 14px 20px; display: flex; gap: 10px; }
    .input-bar input { flex: 1; padding: 12px 16px; border: none; border-radius: 24px; background: #44445c; color: #fff; font-size: 15px; }
    .input-bar input:focus { outline: 2px solid #6c63ff; }
    .input-bar button { background: #6c63ff; border: none; color: white; padding: 12px 20px; border-radius: 24px; font-weight: bold; cursor: pointer; }
    .flash { background: #e74c3c; padding: 8px; text-align: center; font-size: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <a href="{{ url_for('messages_list') }}">←</a>
    <span class="name">{{ partner.username }}</span>
  </div>

  {% with messages_flash = get_flashed_messages() %}{% if messages_flash %}<div class="flash">{{ messages_flash[0] }}</div>{% endif %}{% endwith %}

  <div class="messages" id="messages">
    {% for msg in msgs %}
    <div class="msg {{ 'sent' if msg.sender_id == current_user.id else 'received' }}">
      {{ msg.content }}
      <div class="time">{{ msg.created_at | time_ago }}</div>
    </div>
    {% endfor %}
  </div>

  <form class="input-bar" method="POST">
    <input type="text" name="content" placeholder="Ecris un message..." autocomplete="off" required />
    <button type="submit">Envoyer</button>
  </form>

  <script>
    var el = document.getElementById('messages');
    el.scrollTop = el.scrollHeight;
  </script>
  <script src="{{ url_for('static', filename='fingerprint.js') }}"></script>
</body>
</html>
